name: Idea
description: Suggest a change or a new feature.
labels: [idea]
body:
  - type: textarea
    id: problem
    attributes:
      label: What's the problem or wish?
      description: Describe what you're trying to do and what gets in the way, before any solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
  - type: textarea
    id: alternatives
    attributes:
      label: Anything else you considered?
