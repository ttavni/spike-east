# Keeps dependencies and the pinned GitHub Actions up to date. Dependabot's branches get CI but no
# Vercel preview deploy (vercel.json), so their code never runs with any deployment's secrets.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
